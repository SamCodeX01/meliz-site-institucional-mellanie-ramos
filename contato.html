<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Contato | Méllanie Ramos – Agende sua sessão</title>
    <meta
      name="description"
      content="Agende sua primeira sessão com Méllanie Ramos pelo WhatsApp (11) 93093-5640 ou e-mail."
    />
    <link rel="icon" href="img/logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <main>
      <section class="page-head">
        <div class="wrap"><h1>Contato</h1></div>
      </section>
      <section>
        <div class="wrap contact">
          <div>
            <p class="lead">
              Entre em contato para agendar sua primeira sessão ou para obter
              mais informações sobre como posso apoiá-lo em sua jornada. Estou
              confiante para trabalharmos juntos!
            </p>
            <ul class="ct">
              <li>
                <span class="ico" style="margin: 0; flex: none"
                  ><svg viewBox="0 0 24 24">
                    <path d="M3 21l1.6-4.8A8.5 8.5 0 1 1 8 19.5z" /></svg></span
                ><a
                  href="https://wa.me/5511930935640"
                  target="_blank"
                  rel="noopener"
                  >Telefone / WhatsApp: (11) 93093-5640</a
                >
              </li>
              <li>
                <span class="ico" style="margin: 0; flex: none"
                  ><svg viewBox="0 0 24 24">
                    <rect x="3" y="5" width="18" height="14" rx="2" />
                    <path d="M3 7l9 6 9-6" /></svg></span
                ><a href="mailto:mellanie.meliz.ramos@gmail.com"
                  >mellanie.meliz.ramos@gmail.com</a
                >
              </li>
              <li>
                <span class="ico" style="margin: 0; flex: none"
                  ><svg viewBox="0 0 24 24">
                    <rect x="3" y="3" width="18" height="18" rx="5" />
                    <circle cx="12" cy="12" r="4" /></svg></span
                ><a
                  href="https://instagram.com/psicologa.mellanieramos"
                  target="_blank"
                  rel="noopener"
                  >@psicologa.mellanieramos</a
                >
              </li>
            </ul>
          </div>
          <form id="form">
            <label>Nome<input name="nome" required autocomplete="name" /></label
            ><label
              >E-mail<input
                type="email"
                name="email"
                required
                autocomplete="email"
            /></label>
            <label
              >Telefone<input
                type="tel"
                name="tel"
                required
                autocomplete="tel" /></label
            ><label>Mensagem<textarea name="msg" required></textarea></label>
            <button class="btn" type="submit">Enviar mensagem</button>
            <p class="msg" role="status"></p>
          </form>
        </div>
      </section>
    </main>
    <script src="js/main.js"></script>
  </body>
</html>
